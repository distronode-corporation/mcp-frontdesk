name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole gate on the tagged commit before anything is published.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        # 22.18 is the floor `engines` names (the first Node 22 that strips types by
        # default); 22 and 24 are the latest of each line. 3 systems x 3 = 9 jobs.
        node: ["22.18", 22, 24]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      # oxlint's correctness rules (.oxlintrc.json), warnings included. In every test job, so it
      # is part of the required checks.
      - run: npm run lint
      # Every tracked file against .editorconfig: charset, line endings, final newline, trailing
      # whitespace and indentation. Formatting is the same on every system, so Linux only (a
      # Windows checkout may have CRLF line endings). The binary is the upstream release checked
      # against a pinned SHA-256, as osv-scanner is in supply-chain.yml; a version bump changes
      # both lines, with the digest from the release's checksums.txt.
      - name: EditorConfig
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          EC_VERSION: 4.0.2
          EC_SHA256: 44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/editorconfig-checker.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/editorconfig-checker-linux-amd64.tar.gz"
          echo "${EC_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/editorconfig-checker"
          tar -xzf "$archive" -C "$RUNNER_TEMP/editorconfig-checker" editorconfig-checker
          "$RUNNER_TEMP/editorconfig-checker/editorconfig-checker" --version
          "$RUNNER_TEMP/editorconfig-checker/editorconfig-checker" -format github-actions
      - run: npm run typecheck
      # 100% lines, statements, functions and branches in every file under src/, each file on
      # its own (c8, configured in .c8rc.json). A file no test loads counts, at 0%.
      - run: npm run test:coverage
      - run: npm run build
      # The published tarball holds dist/ and the documents in package.json "files", nothing else.
      - name: Package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e '
            const [pack] = JSON.parse(require("fs").readFileSync("pack.json", "utf8"));
            const allowed = /^(dist\/[a-z-]+\.(js|d\.ts)|README\.md|SECURITY-MODEL\.md|SECURITY\.md|SPEC\.md|CHANGELOG\.md|LICENSE|NOTICE|package\.json)$/;
            const bad = pack.files.map((f) => f.path).filter((p) => !allowed.test(p));
            if (bad.length) { console.error("unexpected files in the package:", bad); process.exit(1); }
            console.log(pack.files.length + " files, " + pack.size + " bytes");
          '
      # The package is reproducible: two packs of this commit (prepack rebuilds dist/ from a
      # clean tree each time) give the same tarball, byte for byte. One system is enough; the
      # README says how to compare a release's files with the package on npm.
      - name: Reproducible package
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack-1" "$RUNNER_TEMP/pack-2"
          npm pack --silent --pack-destination "$RUNNER_TEMP/pack-1" > /dev/null
          npm pack --silent --pack-destination "$RUNNER_TEMP/pack-2" > /dev/null
          one="$(sha256sum "$RUNNER_TEMP"/pack-1/*.tgz | cut -d' ' -f1)"
          two="$(sha256sum "$RUNNER_TEMP"/pack-2/*.tgz | cut -d' ' -f1)"
          echo "first pack  $one"
          echo "second pack $two"
          if [ "$one" != "$two" ]; then
            echo "::error::two packs of the same commit differ."
            exit 1
          fi
      # The built package resolves through its own exports map.
      - name: Exports smoke test
        run: node -e "Promise.all(['mcp-frontdesk','mcp-frontdesk/experimental','mcp-frontdesk/testing'].map((m) => import(m))).then((ms) => console.log(ms.map((m) => Object.keys(m).length)))"
      # The example server against the package built above (its mcp-frontdesk dependency
      # links to this checkout), driven end to end by the official MCP SDK client.
      - name: Example server, install
        working-directory: examples/basic-server
        run: npm ci
      - name: Example server, typecheck
        working-directory: examples/basic-server
        run: npm run typecheck
      - name: Example server, end-to-end test
        working-directory: examples/basic-server
        run: npm test
